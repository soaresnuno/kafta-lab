spring.application.name=product-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/products_db
spring.datasource.username=postgres
spring.datasource.password=secretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer: valores em JSON. O header __TypeId__ leva um nome lógico (ex: stockReserved)
# em vez do nome da classe Java, para o outro serviço o mapear para as suas próprias classes
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=\
  stockReserved:com.nuno.kafkalab.productservice.events.StockReservedEvent,\
  stockRejected:com.nuno.kafkalab.productservice.events.StockRejectedEvent

# Consumer
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
# ErrorHandlingDeserializer: uma mensagem inválida é registada e ignorada, em vez de ficar a falhar para sempre
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=\
  orderCreated:com.nuno.kafkalab.productservice.events.OrderCreatedEvent,\
  orderCancelled:com.nuno.kafkalab.productservice.events.OrderCancelledEvent

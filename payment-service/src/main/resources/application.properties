spring.application.name=payment-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5435/payments_db
spring.datasource.username=postgres
spring.datasource.password=secretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Segurança: só aceita tokens emitidos por este realm do Keycloak.
# A chave pública para validar a assinatura é descarregada daqui na primeira vez que for precisa
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/kafka-lab

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer: só o OutboxRelay envia. O evento já está em JSON na tabela outbox_events,
# por isso key e value vão como String (o serializer por omissão) e o relay põe o header __TypeId__
# Com o Kafka em baixo, o envio falha ao fim de 5s (em vez de 60s) e o relay tenta outra vez mais tarde
spring.kafka.producer.properties.max.block.ms=5000

# Consumer
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
# ErrorHandlingDeserializer: uma mensagem inválida é registada e ignorada, em vez de ficar a falhar para sempre
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=\
  requestPayment:com.nuno.kafkalab.paymentservice.events.RequestPaymentCommand,\
  cancelPayment:com.nuno.kafkalab.paymentservice.events.CancelPaymentCommand

# Pagamentos
# Fornecedor usado nos pagamentos novos. Hoje só existe "fake"; mais tarde, por exemplo, "stripe"
payments.provider=fake
# Fornecedor falso: simula a página de pagamento e envia webhooks assinados, como um fornecedor real.
# Em produção fica desligado (enabled=false) e os seus endpoints deixam de existir
payments.fake.enabled=true
payments.fake.checkout-base-url=http://localhost:8084/fake-provider/checkout
payments.fake.webhook-url=http://localhost:8084/payments/webhooks/fake
payments.fake.webhook-secret=${FAKE_WEBHOOK_SECRET:fake-webhook-secret}

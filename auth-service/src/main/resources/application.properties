spring.application.name=auth-service
server.port=8083

# Keycloak: onde vivem os utilizadores e quem emite os tokens
keycloak.base-url=http://localhost:8180
keycloak.realm=kafka-lab
keycloak.client-id=auth-service
# Num ambiente real o secret vem de uma variável de ambiente ou de um cofre de segredos.
# O valor por omissão é o do realm de desenvolvimento (keycloak/kafka-lab-realm.json)
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:auth-service-secret}
